services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORTA: '3333'
      HOST: 0.0.0.0
      NODE_ENV: production
    ports:
      - '3333:3333'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3333/api/saude']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
